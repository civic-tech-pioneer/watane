[package]
name = "watane-node"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.91"

[lib]
name = "watane_node"

[dependencies]
watane-dist = { path = "../dist" }
watane-net = { path = "../net" }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "signal"] }   # the program waits for SIGINT and SIGTERM
url = "2.5"                # the program parses a relay URL, as net's options hold it
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "3.27"
serde_json = "1.0"
tiny_http = "0.12"
watane-pkg = { path = "../pkg" }   # tests only: pack Alice's fixture mod, as her own tools would

[lints]
workspace = true
