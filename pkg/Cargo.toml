[package]
name = "watane-pkg"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8"
data-encoding = "2.11"
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.2"
wit-parser = "0.254.2"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27"
wit-component = { version = "0.254", features = ["dummy-module"] }

[lints]
workspace = true
