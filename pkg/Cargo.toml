[package]
name = "watane-pkg"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8"
data-encoding = "2.11"
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.2"
wit-parser = "0.254.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
wit-component = { version = "0.254", features = ["dummy-module"] }

[lints.rust]
unsafe_code = "forbid"
