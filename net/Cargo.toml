[package]
name = "watane-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[lib]
name = "watane_net"

[dependencies]
watane-log = { path = "../log" }
iroh = "=1.4.1"
iroh-blobs = "=0.105.0"
iroh-gossip = "=0.102.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
ed25519-dalek = "3.0"
blake3 = "1.8"
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.4"
zeroize = "1.9"
url = "2.5"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.27"
ed25519-compact = "2.6"

[lints.rust]
unsafe_code = "forbid"
