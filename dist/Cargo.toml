[package]
name = "watane-dist"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.91"

[lib]
name = "watane_dist"
# No doc examples: skip the rustdoc pass of every `cargo test`.
doctest = false

[dependencies]
watane-log = { path = "../log" }
watane-pkg = { path = "../pkg" }
url = "2.5"
ureq = "3.5"
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tempfile = "3.27"
blake3 = "1.8"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(windows)'.dependencies]
watane-log-windows-fs = { path = "../log/windows-fs" }

[dev-dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true
