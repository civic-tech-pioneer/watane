[package]
name = "watane-dist"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[lib]
name = "watane_dist"

[dependencies]
watane-log = { path = "../log" }
watane-pkg = { path = "../pkg" }
url = "2.5"
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"
rusqlite = { version = "0.41", features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"
