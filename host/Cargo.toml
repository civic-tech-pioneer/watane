[package]
name = "watane-host"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.95"

[lib]
name = "watane_host"
# No doc examples: skip the rustdoc pass of every `cargo test`.
doctest = false

[[bin]]
name = "watane"
path = "src/bin/watane.rs"

[dependencies]
watane-pkg = { path = "../pkg" }
watane-log = { path = "../log" }
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"
wasmtime = "=48.0.9"
wasmtime-wasi = "=48.0.9"
redb = "4.5"
blake3 = "1.8"
wit-parser = "=0.254.2"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"

[lints]
workspace = true
