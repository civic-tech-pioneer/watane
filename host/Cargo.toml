[package]
name = "watane-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.95"

[lib]
name = "watane_host"
# No doc examples: skip the rustdoc pass of every `cargo test`.
doctest = false

[[bin]]
name = "watane"
path = "src/bin/watane.rs"

[dependencies]
watane-pkg = { path = "../pkg" }
watane-log = { path = "../log" }
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"
wasmtime = "=48.0.10"
wasmtime-wasi = "=48.0.10"
redb = "4.5"
blake3 = "1.8"
unicode-normalization = "0.1.26"
rustix = { version = "1", features = ["event", "fs", "process"] }
wit-parser = "=0.254.2"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[features]
# Step 11 (TECHNICAL 19.9): a source of host streams, a held consumer, a clock and the writer's
# numbers for host's own A1 tests. Never in a release build.
test-streams = []

[target.'cfg(windows)'.dependencies]
watane-log-windows-fs = { path = "../log/windows-fs" }

[dev-dependencies]
watane-host = { path = ".", features = ["test-streams"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tempfile = "3"

[lints]
workspace = true
