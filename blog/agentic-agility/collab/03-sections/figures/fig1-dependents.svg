<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" role="img">
<title>One unchecked assumption, four pieces of work built on it</title>
<desc>The request "make the dashboard load faster" leads the agent to an unchecked assumption: team membership is a safe boundary for sharing a cached result. The existing per-viewer permission rules say otherwise, but were not consulted. Four pieces of work are built on the assumption: the cache key is the team, the cache is cleared on team events, tests expect teammates to get the same totals, and a sub-agent applies the same pattern to the CSV export. They are not known to be wrong; each needs another look once the assumption is checked.</desc>
<style>
  .bg{fill:#ffffff}.node{fill:#f4f3ef;stroke:#8a877f;stroke-width:1}
  .prem{fill:#fdf1e7;stroke:#c2652a;stroke-width:1.6;stroke-dasharray:6 4}
  .t{font:15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#26251f}
  .s{font:13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#5f5d55}
  .ln{stroke:#8a877f;stroke-width:1.3;fill:none}
  .dl{stroke:#c2652a;stroke-width:1.4;fill:none;stroke-dasharray:5 3}
  .dot{fill:#c2652a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1d1c1a}.node{fill:#2a2926;stroke:#8f8c84}
    .prem{fill:#3a2618;stroke:#e08a52}
    .t{fill:#ecebe6}.s{fill:#b5b2a9}.ln{stroke:#8f8c84}.dl{stroke:#e08a52}.dot{fill:#e08a52}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect class="bg" width="560" height="470"/>
<rect class="node" x="20" y="20" width="240" height="64" rx="8"/>
<text class="s" x="36" y="44">Request</text>
<text class="t" x="36" y="68">"Make the dashboard load faster."</text>
<rect class="node" x="300" y="20" width="240" height="64" rx="8"/>
<text class="s" x="316" y="44">Existing rule, not consulted</text>
<text class="t" x="316" y="68">Query runs per viewer's rights</text>
<path class="ln" d="M140 84 V118" marker-end="url(#a)"/>
<rect class="prem" x="20" y="120" width="520" height="70" rx="8"/>
<text class="s" x="36" y="145">Agent's assumption, unchecked</text>
<text class="t" x="36" y="170">Team membership is a safe boundary for sharing a cached result</text>
<path class="ln" d="M420 84 V118" stroke-dasharray="3 4" marker-end="url(#a)"/>
<text class="s" x="430" y="106">contradicts</text>
<path class="dl" d="M280 190 V364"/>
<path class="dl" d="M280 274 H262" marker-end="url(#a)"/><path class="dl" d="M280 274 H298" marker-end="url(#a)"/>
<path class="dl" d="M280 364 H262" marker-end="url(#a)"/><path class="dl" d="M280 364 H298" marker-end="url(#a)"/>
<rect class="node" x="20" y="244" width="240" height="60" rx="8"/><circle class="dot" cx="36" cy="274" r="4"/><text class="t" x="50" y="279">Cache key = team</text>
<rect class="node" x="300" y="244" width="240" height="60" rx="8"/><circle class="dot" cx="316" cy="274" r="4"/><text class="t" x="330" y="279">Cleared on team events</text>
<rect class="node" x="20" y="334" width="240" height="60" rx="8"/><circle class="dot" cx="36" cy="364" r="4"/><text class="t" x="50" y="358">Tests: teammates get</text><text class="t" x="50" y="378">the same totals</text>
<rect class="node" x="300" y="334" width="240" height="60" rx="8"/><circle class="dot" cx="316" cy="364" r="4"/><text class="t" x="330" y="358">Sub-agent: same pattern</text><text class="t" x="330" y="378">for the CSV export</text>
<text class="s" x="20" y="428">Each box is built on the assumption. Not all are wrong;</text>
<text class="s" x="20" y="447">each needs another look once the assumption is checked.</text>
</svg>
