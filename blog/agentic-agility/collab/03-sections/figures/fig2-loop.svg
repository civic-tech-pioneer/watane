<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" role="img">
<title>The loop, and what each pass does to the choices for the next step</title>
<desc>Top: a loop. The agent investigates or experiments, then exposes open decisions. If a decision is consequential and unresolved, the human resolves the tradeoff; otherwise, within agreed bounds, the agent goes straight on. Either way the decision record is updated and the agent acts and checks, which feeds the next investigation. Bottom, schematic: an agreed region of constraints stays fixed while the known choices for the next step, drawn as a dashed box, narrow from wide open after the request, to narrower after the first decisions, to within the agreed constraints, when the next bounded step can be delegated. New evidence can reopen the choices.</desc>
<style>
  .bg{fill:#ffffff}.node{fill:#f4f3ef;stroke:#8a877f;stroke-width:1}
  .hum{fill:#e3f2ec;stroke:#1d8a63;stroke-width:1.3}
  .ok{fill:#cfeee0;stroke:#1d8a63;stroke-width:1}
  .might{fill:none;stroke:#c2652a;stroke-width:1.7;stroke-dasharray:6 4}
  .pan{fill:none;stroke:#c9c6bd;stroke-width:1}
  .t{font:15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#26251f}
  .s{font:13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#5f5d55}
  .ln{stroke:#8a877f;stroke-width:1.3;fill:none}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1d1c1a}.node{fill:#2a2926;stroke:#8f8c84}
    .hum{fill:#173a2d;stroke:#4cc496}.ok{fill:#1d4a39;stroke:#4cc496}
    .might{stroke:#e08a52}.pan{stroke:#4a4842}
    .t{fill:#ecebe6}.s{fill:#b5b2a9}.ln{stroke:#8f8c84}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect class="bg" width="560" height="560"/>
<!-- loop -->
<rect class="node" x="20" y="20" width="210" height="60" rx="8"/>
<text class="t" x="36" y="46">Investigate,</text><text class="t" x="36" y="66">experiment</text>
<rect class="node" x="330" y="20" width="210" height="60" rx="8"/>
<text class="t" x="346" y="46">Expose the open</text><text class="t" x="346" y="66">decisions</text>
<rect class="hum" x="330" y="170" width="210" height="60" rx="8"/>
<text class="t" x="346" y="196">Human resolves</text><text class="t" x="346" y="216">the tradeoff</text>
<rect class="node" x="20" y="170" width="210" height="60" rx="8"/>
<text class="t" x="36" y="196">Update the record,</text><text class="t" x="36" y="216">act and check</text>
<path class="ln" d="M230 50 H328" marker-end="url(#a)"/>
<path class="ln" d="M435 80 V168" marker-end="url(#a)"/>
<text class="s" x="443" y="120">consequential,</text><text class="s" x="443" y="136">unresolved</text>
<path class="ln" d="M330 200 H232" marker-end="url(#a)"/>
<path class="ln" d="M125 170 V82" marker-end="url(#a)"/>
<path class="ln" d="M345 80 L232 168" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="s" x="214" y="112">within agreed</text><text class="s" x="214" y="128">bounds</text>
<!-- panels -->
<line class="pan" x1="20" y1="262" x2="540" y2="262"/>
<rect class="pan" x="20" y="285" width="160" height="150" rx="6"/>
<rect class="pan" x="200" y="285" width="160" height="150" rx="6"/>
<rect class="pan" x="380" y="285" width="160" height="150" rx="6"/>
<ellipse class="ok" cx="100" cy="360" rx="44" ry="40"/>
<ellipse class="ok" cx="280" cy="360" rx="44" ry="40"/>
<ellipse class="ok" cx="460" cy="360" rx="44" ry="40"/>
<rect class="might" x="28" y="293" width="144" height="134" rx="4"/>
<rect class="might" x="236" y="318" width="96" height="86" rx="4"/>
<rect class="might" x="436" y="338" width="44" height="42" rx="4"/>
<text class="t" x="100" y="458" text-anchor="middle">After the request</text>
<text class="t" x="280" y="458" text-anchor="middle">After decisions</text>
<text class="t" x="460" y="458" text-anchor="middle">Next step</text>
<text class="s" x="100" y="476" text-anchor="middle">wide open</text>
<text class="s" x="280" y="476" text-anchor="middle">narrower</text>
<text class="s" x="460" y="476" text-anchor="middle">within bounds</text>
<ellipse class="ok" cx="30" cy="508" rx="10" ry="8"/><text class="s" x="48" y="512">agreed constraints and decisions</text>
<rect class="might" x="290" y="501" width="20" height="14" rx="2"/><text class="s" x="318" y="512">known choices for the next step</text>
<text class="s" x="20" y="542">Schematic. New evidence can reopen the choices.</text>
</svg>
