<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 808" width="560" height="808" role="img" aria-labelledby="attention-title attention-desc">
  <title id="attention-title">Direct attention to the cache and the rules it affects</title>
  <desc id="attention-desc">Illustrative dashboard review. Green marks the existing constraint that every viewer sees only permitted data, not proof that the implementation is correct. A changed cache uses a team key and a ten-minute lifetime. Orange dashed outlines mark the interaction to inspect closely: cache hits, viewer permissions, and permission changes; and the open product decision about data freshness. Data freshness must not relax access rules. A neutral box proposes a loading-state spot-check outside the flagged area, without certifying it as low risk. Arrows connect relevant constraints and questions, not execution stages or numerical risk scores.</desc>
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f4f3ef; stroke: #8a877f; stroke-width: 1; }
    .agreed { fill: #e3f2ec; stroke: #1d8a63; stroke-width: 1.2; }
    .open { fill: #fdf1e7; stroke: #c2652a; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .t { font: 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #26251f; }
    .s { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5f5d55; }
    .ln { stroke: #8a877f; stroke-width: 1.2; fill: none; marker-end: url(#attention-arrow); }
    .arrow { fill: #8a877f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1d1c1a; }
      .node { fill: #2a2926; stroke: #8f8c84; }
      .agreed { fill: #173a2d; stroke: #4cc496; }
      .open { fill: #3a2618; stroke: #e08a52; }
      .t { fill: #ecebe6; }
      .s { fill: #b5b2a9; }
      .ln { stroke: #8f8c84; }
      .arrow { fill: #8f8c84; }
    }
    @media (max-width: 420px) {
      .t { font-size: 24px; }
      .s { font-size: 21px; }
    }
  </style>
  <defs>
    <marker id="attention-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
  </defs>
  <rect class="bg" width="560" height="808"/>

  <rect class="agreed" x="20" y="20" width="520" height="108" rx="8"/>
  <text class="s" x="36" y="44">EXISTING CONSTRAINT TO PRESERVE</text>
  <text class="t" x="36" y="76">Each viewer sees only permitted data</text>
  <text class="s" x="36" y="104">Investigate authorization and query scope</text>

  <path class="ln" d="M 280 128 V 166"/>
  <rect class="node" x="20" y="170" width="520" height="108" rx="8"/>
  <text class="s" x="36" y="194">CHANGED CACHE</text>
  <text class="t" x="36" y="226">Team key · ten-minute lifetime</text>
  <text class="s" x="36" y="254">New reuse and expiry behavior</text>

  <path class="ln" d="M 280 278 V 316"/>
  <rect class="open" x="20" y="320" width="520" height="160" rx="8"/>
  <text class="s" x="36" y="344">LOOK CLOSELY · UNEXAMINED</text>
  <text class="t" x="36" y="374">Cache hit × viewer permissions</text>
  <text class="t" x="36" y="406">× permission change</text>
  <text class="s" x="36" y="438">Inspect key, access checks, and assertions</text>

  <path class="ln" d="M 540 224 H 550 V 570 H 543"/>
  <rect class="open" x="20" y="516" width="520" height="108" rx="8"/>
  <text class="s" x="36" y="540">HUMAN DECISION · OPEN</text>
  <text class="t" x="36" y="572">How stale may the numbers be?</text>
  <text class="s" x="36" y="600">Stale numbers cannot relax access rules</text>

  <rect class="node" x="20" y="680" width="520" height="108" rx="8"/>
  <text class="s" x="36" y="704">SPOT-CHECK · OUTSIDE FLAGGED AREA</text>
  <text class="t" x="36" y="736">Example: loading-state behavior</text>
  <text class="s" x="36" y="764">Sample outside selection; risk still uncertain</text>
</svg>
