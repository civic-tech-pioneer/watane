<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 554" width="560" height="554" role="img" aria-labelledby="review-title review-desc">
  <title id="review-title">The changed code and the review focus are different</title>
  <desc id="review-desc">Two views of the same illustrative dashboard relationship. In the first, existing access rules are unchanged and only the team cache is marked as changed. In the second, an orange dashed boundary includes both components and their connection: the review asks whether reusing a result preserves the existing access rules. A role change followed by a cache hit is a concrete case to check. The connection represents a contract the cache must preserve, not an execution sequence or a measured risk score.</desc>
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f4f3ef; stroke: #8a877f; stroke-width: 1; }
    .changed { stroke: #49473f; stroke-width: 2.2; }
    .focus { fill: #fdf1e7; stroke: #c2652a; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .link { stroke: #8a877f; stroke-width: 1.2; fill: none; }
    .inspect { stroke: #c2652a; stroke-width: 2.2; fill: none; }
    .divider { stroke: #d7d4ca; stroke-width: 1; }
    .h { font: 500 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #26251f; }
    .t { font: 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #26251f; }
    .s { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5f5d55; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1d1c1a; }
      .node { fill: #2a2926; stroke: #8f8c84; }
      .changed { stroke: #ecebe6; }
      .focus { fill: #3a2618; stroke: #e08a52; }
      .link { stroke: #8f8c84; }
      .inspect { stroke: #e08a52; }
      .divider { stroke: #4a4842; }
      .h, .t { fill: #ecebe6; }
      .s { fill: #b5b2a9; }
    }
    @media (max-width: 420px) {
      .h { font-size: 28px; }
      .t { font-size: 24px; }
      .s { font-size: 21px; }
    }
  </style>
  <rect class="bg" width="560" height="554"/>

  <text class="h" x="20" y="32">Changed code</text>
  <rect class="node" x="40" y="66" width="200" height="100" rx="8"/>
  <text class="s" x="56" y="96">UNCHANGED</text>
  <text class="t" x="56" y="132">Access rules</text>
  <path class="link" d="M 240 122 H 320"/>
  <rect class="node changed" x="320" y="66" width="200" height="100" rx="8"/>
  <text class="s" x="336" y="96">CHANGED</text>
  <text class="t" x="336" y="132">Team cache</text>

  <line class="divider" x1="20" y1="202" x2="540" y2="202"/>

  <text class="h" x="20" y="244">Review focus</text>
  <rect class="focus" x="20" y="268" width="520" height="184" rx="10"/>
  <rect class="node" x="40" y="292" width="200" height="100" rx="8"/>
  <text class="s" x="56" y="322">UNCHANGED</text>
  <text class="t" x="56" y="358">Access rules</text>
  <path class="inspect" d="M 240 348 H 320"/>
  <rect class="node changed" x="320" y="292" width="200" height="100" rx="8"/>
  <text class="s" x="336" y="322">CHANGED</text>
  <text class="t" x="336" y="358">Team cache</text>
  <text class="s" x="40" y="426">Does reuse preserve the access rules?</text>

  <text class="t" x="40" y="496">After a role change,</text>
  <text class="t" x="40" y="530">what can the next cache hit reveal?</text>
</svg>
