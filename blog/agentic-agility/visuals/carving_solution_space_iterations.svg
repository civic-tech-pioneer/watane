<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 290" role="img"><title>Carving the solution space</title><desc>Four panels. A fixed teal ellipse represents what the human would accept. A dashed coral rectangle, representing what the agent might build, shrinks each iteration until it lies entirely inside the ellipse.</desc>
<style>.box{fill:#f6f5f2;stroke:#c9c6bf}.c-teal{fill:#9fe1cb;stroke:#0f6e56}.th{font:500 14px sans-serif;fill:#2c2c2a}.ts{font:12px sans-serif;fill:#5f5e5a}</style>
<rect class="box" x="45" y="40" width="130" height="150" rx="8" stroke-width="0.5"/>
<rect class="box" x="195" y="40" width="130" height="150" rx="8" stroke-width="0.5"/>
<rect class="box" x="345" y="40" width="130" height="150" rx="8" stroke-width="0.5"/>
<rect class="box" x="495" y="40" width="130" height="150" rx="8" stroke-width="0.5"/>
<ellipse class="c-teal" cx="110" cy="115" rx="45" ry="34" stroke-width="0.5"/>
<ellipse class="c-teal" cx="260" cy="115" rx="45" ry="34" stroke-width="0.5"/>
<ellipse class="c-teal" cx="410" cy="115" rx="45" ry="34" stroke-width="0.5"/>
<ellipse class="c-teal" cx="560" cy="115" rx="45" ry="34" stroke-width="0.5"/>
<rect x="53" y="48" width="114" height="134" rx="4" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="208" y="62" width="100" height="100" rx="4" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="370" y="80" width="82" height="66" rx="4" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="533" y="98" width="54" height="34" rx="4" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="th" x="110" y="212" text-anchor="middle">Light prompt</text>
<text class="ts" x="110" y="230" text-anchor="middle">Wide open</text>
<text class="th" x="260" y="212" text-anchor="middle">Iteration 1</text>
<text class="ts" x="260" y="230" text-anchor="middle">Costly decisions</text>
<text class="th" x="410" y="212" text-anchor="middle">Iteration 2</text>
<text class="ts" x="410" y="230" text-anchor="middle">Ambiguities resolved</text>
<text class="th" x="560" y="212" text-anchor="middle">Carved</text>
<text class="ts" x="560" y="230" text-anchor="middle">Safe to delegate</text>
<ellipse class="c-teal" cx="160" cy="268" rx="9" ry="7" stroke-width="0.5"/>
<text class="ts" x="176" y="272">What you would accept</text>
<rect x="356" y="262" width="18" height="12" rx="2" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="ts" x="382" y="272">What the agent might build</text>
</svg>
