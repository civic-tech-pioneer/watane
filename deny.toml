# cargo deny check: dependency licences, bans, sources and security advisories.
# factory/check.sh runs `bans licenses sources` when a task changes Cargo.lock;
# factory/check-main.sh runs all four (advisories change daily, so they never fail a task).

[graph]
all-features = true

[advisories]
# Unmaintained crates deep in tauri/iroh are not ours to fix; warn only on our direct ones.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licences only. A crate offered under "X OR GPL" passes through X.
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause", "BSD-2-Clause",
  "BSD-3-Clause", "BSL-1.0", "BlueOak-1.0.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT",
  "MIT-0", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true  # our own crates are unpublished; they carry MIT OR Apache-2.0 and need no check

[bans]
multiple-versions = "allow"  # tauri and iroh pull several versions; hakari keeps the build single
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
