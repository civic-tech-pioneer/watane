[package]
name = "watane-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "watane_app"
# No doc examples: skip the rustdoc pass of every `cargo test`.
doctest = false

[features]
driver = ["dep:webkit2gtk"]
real-github = ["driver"]

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
watane-node = { path = "../node" }
watane-host = { path = "../host" }
watane-dist = { path = "../dist" }
axum = "0.8"
base64 = "0.23"
open = "5"
ring = { version = "0.17", features = ["std"] }
subtle = { version = "2", default-features = false }
ureq = { version = "3", features = ["json"] }
tauri-plugin-dialog = "=2.8.4"
tauri = "=2.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
getrandom = "0.3"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
redb = "4.5" # J9: read the command mod's persisted click, as host/tests/it/collect.rs does.
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Driver-only: let popup attempts reach the native deny hook, as on macOS.
webkit2gtk = { version = "=2.0.2", optional = true }

# The workspace lints without unsafe_code: driver.rs calls AppKit over FFI.
[lints.rust]
unstable_features = "deny"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
ref_option = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
needless_for_each = "deny"
undocumented_unsafe_blocks = "deny"
derive_partial_eq_without_eq = "allow"
missing_const_for_fn = "allow"
# Microsoft Pragmatic Rust Guidelines lints that agree with Google style (M-STATIC-VERIFICATION).
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
