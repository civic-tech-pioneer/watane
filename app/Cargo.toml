[package]
name = "watane-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "watane_app"

[features]
driver = ["dep:webkit2gtk"]
real-github = ["driver"]

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
watane-node = { path = "../node" }
watane-host = { path = "../host" }
watane-dist = { path = "../dist" }
axum = "0.8"
tauri-plugin-dialog = "=2.8.4"
tauri = "=2.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
getrandom = "0.3"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
redb = "4.5" # J9: read the command mod's persisted click, as host/tests/collect.rs does.
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }

ureq = "3" # Real Pages harness: HTTPS with the same rustls client as dist.

[target.'cfg(target_os = "linux")'.dependencies]
# Driver-only: let popup attempts reach the native deny hook, as on macOS.
webkit2gtk = { version = "=2.0.2", optional = true }
