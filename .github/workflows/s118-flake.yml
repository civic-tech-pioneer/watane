# TEMPORARY (S118 item 1): runs host's consent and https_stream tests 20 times on each OS, with
# their modules alongside for load. Removed before S118 is delivered.
name: S118 flake loop

on:
  push:
    branches: [slice/s118]
    paths: [host/tests/it/**, .github/workflows/s118-flake.yml]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  loop:
    name: loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Build
        shell: bash
        run: cargo test -p watane-host --test it --locked --no-run
      - name: Loop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export WATANE_TEST_BASH="$(cygpath -m "$(command -v bash)")"
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER="pwsh -NoProfile -File $(cygpath -m "$PWD/.github/scripts/windows-test.ps1")"
          fi
          export WATANE_HOME="$RUNNER_TEMP/watane-home"; mkdir -p "$WATANE_HOME"
          a=consent::ac5_a_consent_given_through_one_provider_is_not_used_through_another
          b=https_stream::ac5_a_refused_consent_ends_the_stream_consent_refused
          fail=0
          for i in $(seq 1 20); do
            echo "::group::run $i"
            # The two modules run together, as in the full suite, so the two tests run under load.
            if cargo test -p watane-host --test it --locked -- consent:: https_stream:: > out.txt 2>&1; then
              echo "run $i: green"
            else
              echo "run $i: RED"; fail=$((fail+1))
            fi
            grep -E "^test ($a|$b) \.\.\.|test result|panicked" out.txt || true
            # `consent` is #[cfg(unix)] (tests/it/main.rs): on Windows only the https_stream test exists.
            if [ "$RUNNER_OS" != "Windows" ]; then grep -qE "^test $a \.\.\. ok" out.txt || { echo "run $i: $a did not pass"; fail=$((fail+1)); }; fi
            grep -qE "^test $b \.\.\. ok" out.txt || { echo "run $i: $b did not pass"; fail=$((fail+1)); }
            echo "::endgroup::"
          done
          echo "red runs: $fail of 20"
          [ "$fail" -eq 0 ]
