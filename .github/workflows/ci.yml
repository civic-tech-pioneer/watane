# The slow sensor: the whole workspace's checks on Linux, macOS and Windows, for every pull request
# to main and every push to main (factory/README.md, "Two feedback loops"). The same steps as
# factory/check-main.sh. Default tests only: slow, journey, front, timing and real tests are
# #[ignore]d and stay out. fmt and cargo deny do not depend on the OS, so they run once, on Linux.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # app's `driver` (window) tests need a GUI session: macOS runners have one. Linux runs
          # them in Docker with Xvfb (app/scripts/linux-test.sh); Windows has no driver yet.
          - os: ubuntu-latest
            features: watane-dev/fake-host
          - os: macos-15
            features: watane-app/driver,watane-dev/fake-host
          - os: windows-latest
            features: watane-dev/fake-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages (Tauri's WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        shell: bash
        run: cargo build --workspace --locked --features "${{ matrix.features }}"
      - name: Test
        shell: bash
        run: |
          # dev's tests run the real watane; tests never touch the runner's home.
          export WATANE_BIN="$PWD/target/debug/watane"
          export WATANE_HOME="$RUNNER_TEMP/watane-home"; mkdir -p "$WATANE_HOME"
          cargo test --workspace --locked --features "${{ matrix.features }}" --no-fail-fast
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked --features "${{ matrix.features }}" -- -D warnings

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fmt (nightly: rustfmt.toml sets nightly-only options)
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --all --check
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check
