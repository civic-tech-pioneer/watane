# The slow sensor: the whole workspace's checks on Linux, macOS and Windows, for every pull request
# to main and every push to main (factory/README.md, "Two feedback loops"). The same steps as
# factory/check-main.sh. Default tests only: slow, journey, front, timing and real tests are
# #[ignore]d and stay out. fmt and cargo deny do not depend on the OS, so they run once, on Linux.
# A change to planning files only (PLAN.md, DONE.md, decisions) skips build and tests but still
# reports every required check. A test that fails and then passes on a rerun is flaky: it opens an
# issue instead of failing the job (.github/scripts/test-flaky.sh).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write  # test-flaky.sh files `flaky` issues

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # app's `driver` (window) tests need a GUI session: macOS runners have one. Linux runs
          # them in Docker with Xvfb (app/scripts/linux-test.sh); Windows has no driver yet.
          - os: ubuntu-latest
            features: watane-dev/fake-host
            # A fake of macOS's `open` for the clean-Mac guest bridge, which only ever runs on a
            # Mac; on Linux its FIFO handshake misses the echoed request (install, S94's to weigh).
            skip: --skip clean_mac::ac3_guest_bridge_streams_driver_and_reports_open_failure
          - os: macos-26  # nearest to the Mac (macOS 27): macos-15 lacks /dev/full and signs differently
            features: watane-app/driver,watane-dev/fake-host
          - os: windows-latest
            features: watane-dev/fake-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Planning files only?
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ "${{ github.event_name }}" != workflow_dispatch ] && [ -n "$BASE" ] \
             && files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename'); then
            # The compare API lists at most 300 files: that many is never planning only.
            n=$(printf '%s\n' "$files" | grep -c .)
            if [ "$n" -gt 0 ] && [ "$n" -lt 300 ] \
               && ! printf '%s\n' "$files" | grep -qvE '^factory/(PLAN\.md|DONE\.md|decisions/)'; then
              code=false
            fi
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "code changed: $code"
      - name: Linux packages (Tauri's WebKitGTK)
        if: runner.os == 'Linux' && steps.scope.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Toolchain (rust-toolchain.toml)
        if: steps.scope.outputs.code == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      # Saved from every ref: a PR's fix push reuses its own cache; main's serves every new PR.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.code == 'true'
        with:
          cache-on-failure: ${{ runner.os == 'Windows' }}
      - name: dev's vendor folder (git-ignored; dev's build tests need it)
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: dev/scripts/vendor.sh
      - name: Build
        if: steps.scope.outputs.code == 'true'
        shell: bash
        # --keep-going: every crate that does not compile shows up in one run (Windows).
        run: cargo build --workspace --locked --keep-going --features "${{ matrix.features }}"
      - name: Test
        if: steps.scope.outputs.code == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dev's tests run the real watane; tests never touch the runner's home.
          WATANE_BIN="$PWD/target/debug/watane"
          if [ "$RUNNER_OS" = "Windows" ]; then
            WATANE_BIN="$WATANE_BIN.exe"
            export WATANE_TEST_BASH="$(cygpath -m "$(command -v bash)")"
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER="pwsh -NoProfile -File $(cygpath -m "$PWD/.github/scripts/windows-test.ps1")"
          fi
          export WATANE_BIN
          export WATANE_HOME="$RUNNER_TEMP/watane-home"; mkdir -p "$WATANE_HOME"
          # Tests' scratch (install's shared fakes) is reused when present; a cached partial
          # copy made 129 install tests fail. It is never worth caching.
          rm -rf target/tmp
          .github/scripts/test-flaky.sh "${{ matrix.features }}" ${{ matrix.skip }}
      # S103: the agent consent view and its withdrawal on the real app (app S58, S60) need a GUI
      # session; the cloud build team has no Mac, so this job is where they are checked.
      - name: App window tests of the agent consent (S58, S60)
        if: runner.os == 'macOS' && steps.scope.outputs.code == 'true'
        shell: bash
        run: |
          export WATANE_HOME="$RUNNER_TEMP/watane-home-s103"; mkdir -p "$WATANE_HOME"
          cargo test -p watane-app --locked --features watane-app/driver --test it -- --ignored s58_ s60_
      - name: Clippy
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: cargo clippy --workspace --all-targets --locked --features "${{ matrix.features }}" -- -D warnings

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fmt (nightly, as rustfmt.toml sets nightly-only options)
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --all --check
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check
      # factory/PLAN.md holds the present only (deputy skill, section 0): prune it, never raise this.
      - name: PLAN.md at most 500 lines
        run: |
          n=$(wc -l < factory/PLAN.md)
          echo "factory/PLAN.md: $n lines"
          [ "$n" -le 500 ] || { echo "::error file=factory/PLAN.md::$n lines, over 500: move history to DONE.md, upkeep to issues, settled decisions to their spec"; exit 1; }
