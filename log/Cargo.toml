[package]
name = "watane-log"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[lib]
name = "watane_log"

[dependencies]
ed25519-dalek = "3.0"
getrandom = "0.4"
blake3 = "1.8"
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }
data-encoding = "2.11"
zeroize = "1.9"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.27"
ed25519-compact = "2.6"

[lints.rust]
unsafe_code = "forbid"
