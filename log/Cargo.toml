[package]
name = "watane-log"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[lib]
name = "watane_log"

[dependencies]
ed25519-dalek = "3.0"
getrandom = "0.4"
blake3 = "1.8"
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }
data-encoding = "2.11"
zeroize = "1.9"
thiserror = "2.0"

rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3.27"
proptest = "1.12"
ed25519-compact = "2.6"

[lints.rust]
unsafe_code = "forbid"
